<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duskra Online</title>
<meta name="description" content="Duskra Online: a live space MMO for iPhone and Android.">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { --bg:#0b0f17; --panel:#121927; --text:#dfe6f2; --muted:#93a0b6; --line:#263247; --accent:#6fb3ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px 64px; text-align:center; }
  img { width:128px; height:128px; border-radius:28px; border:1px solid var(--line); }
  h1 { font-size:2rem; margin:20px 0 4px; }
  p { margin:0 0 16px; }
  a { color:var(--accent); }
  .meta { color:var(--muted); }
  .links a { display:inline-block; margin:4px 10px; }
  .stores { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:24px 0; }
  .store { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 16px; min-width:180px; }
  .store span { display:block; color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>
<main>
<img src="icon.png" alt="Duskra Online icon" width="128" height="128">
<h1>Duskra Online</h1>
<p>A live space MMO for iPhone and Android: hunt, loot and upgrade your ship in one shared world.</p>
<p class="meta">Season 0 · closed test</p>
<div class="stores">
  <div class="store">App Store<span>coming soon</span></div>
  <div class="store">Google Play<span>coming soon</span></div>
</div>
<p class="links"><a href="support">Support</a><a href="privacy">Privacy policy</a><a href="delete-account">Delete account</a></p>
<p class="meta"><a href="mailto:support@duskraonline.com">support@duskraonline.com</a></p>
</main>
</body>
</html>
